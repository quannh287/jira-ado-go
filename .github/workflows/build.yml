name: Build

# Pushes to main and pull requests only test. Release Please calls this with a tag to build and attach the DMG;
# "Run workflow" builds on demand.

on:
  push:
    branches: [main]
    paths-ignore: # changes that can't break the build or the tests (keep in sync with pull_request)
      - "**/*.md"
      - "docs/**"
      - "design/**" # logo sources; the app ships Assets.xcassets
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "design/**"
      - ".gitignore"
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.7.0
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: write # uploading the DMG to the release

concurrency:
  group: build-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: jira-ado-swift.xcodeproj
  SCHEME: jira-ado-swift
  # Ad hoc signing, as the Go releases were: no certificate in CI. Users open it once with right-click → Open.
  SIGNING: CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # UI tests need a logged-in GUI session with accessibility rights, which hosted runners don't grant; run them locally.
      - name: Unit tests
        run: |
          xcodebuild test -project "$PROJECT" -scheme "$SCHEME" -destination 'platform=macOS' \
            -only-testing:jira-ado-swiftTests -resultBundlePath TestResults.xcresult -quiet $SIGNING
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: TestResults.xcresult

  build:
    # Releases and manual runs only, so every push to main isn't built.
    if: inputs.tag || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Take the version from the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag $TAG isn't vMAJOR.MINOR.PATCH"
              exit 1
            fi
          else
            version=$(grep -m1 'MARKETING_VERSION = ' "$PROJECT/project.pbxproj" | sed -E 's/.*= ([^;]+);/\1/')
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build (universal)
        run: |
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build -quiet \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" $SIGNING
          app=build/Build/Products/Release/JirAdo.app
          # Ad hoc signing adds get-task-allow (debugger attach); re-sign with the same entitlements minus that one.
          codesign -d --entitlements - --xml "$app" > entitlements.plist
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.security.get-task-allow' entitlements.plist || true
          codesign --force --sign - --options runtime --entitlements entitlements.plist "$app"
          codesign -d --entitlements - "$app"
          lipo -archs "$app/Contents/MacOS/JirAdo"
          codesign --verify --strict "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Disk image
        run: |
          mkdir -p dmg dist
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "jira-ado $VERSION" -srcfolder dmg -fs HFS+ -format UDZO -ov "dist/jira-ado-$VERSION.dmg"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: jira-ado-macOS
          path: dist/*
          if-no-files-found: error

  release:
    if: inputs.tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Release Please already published the release with the changelog as its notes; this only adds the app.
      - name: Attach the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
