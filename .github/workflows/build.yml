name: Build

# Pushes to main and pull requests only test. A tag builds and releases; "Run workflow" builds on demand.
# Releasing: push a tag, e.g. `git tag v0.3.0 && git push origin v0.3.0`.
# The tag is the version: the app is built with it, the release is published with it,
# and MARKETING_VERSION on main is bumped to it afterwards.

on:
  push:
    branches: [main]
    tags: ["v*"] # path filters don't apply to tags: a tag always builds
    paths-ignore: # changes that can't break the build or the tests (keep in sync with pull_request)
      - "**/*.md"
      - "docs/**"
      - "design/**" # logo sources; the app ships Assets.xcassets
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "design/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write # the release on tags, and the version bump on main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: jira-ado-swift.xcodeproj
  SCHEME: jira-ado-swift
  # Ad hoc signing, as the Go releases were: no certificate in CI. Users open it once with right-click → Open.
  SIGNING: CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # UI tests need a logged-in GUI session with accessibility rights, which hosted runners don't grant; run them locally.
      - name: Unit tests
        run: |
          xcodebuild test -project "$PROJECT" -scheme "$SCHEME" -destination 'platform=macOS' \
            -only-testing:jira-ado-swiftTests -resultBundlePath TestResults.xcresult -quiet $SIGNING
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: TestResults.xcresult

  build:
    # Tags only (and manual runs), so a commit isn't built twice: once on main, again for its tag.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Take the version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME isn't vMAJOR.MINOR.PATCH"
              exit 1
            fi
          else
            version=$(grep -m1 'MARKETING_VERSION = ' "$PROJECT/project.pbxproj" | sed -E 's/.*= ([^;]+);/\1/')
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build (universal)
        run: |
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build -quiet \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" $SIGNING
          app=build/Build/Products/Release/jira-ado.app
          # Ad hoc signing adds get-task-allow (debugger attach); re-sign with the same entitlements minus that one.
          codesign -d --entitlements - --xml "$app" > entitlements.plist
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.security.get-task-allow' entitlements.plist || true
          codesign --force --sign - --options runtime --entitlements entitlements.plist "$app"
          codesign -d --entitlements - "$app"
          lipo -archs "$app/Contents/MacOS/jira-ado"
          codesign --verify --strict "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Disk image
        run: |
          mkdir -p dmg dist
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "jira-ado $VERSION" -srcfolder dmg -fs HFS+ -format UDZO -ov "dist/jira-ado-$VERSION.dmg"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: jira-ado-macOS
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release with the app
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A rerun: replace the files and make sure it's published.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi

  bump-version:
    # After the release: main's MARKETING_VERSION says the newest released version, so local builds match.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Commit the version to main
        run: |
          version="${GITHUB_REF_NAME#v}"
          pbx="$PROJECT/project.pbxproj"
          current=$(grep -m1 'MARKETING_VERSION = ' "$pbx" | sed -E 's/.*= ([^;]+);/\1/')
          newest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)
          if [ "$current" = "$version" ] || [ "$newest" != "$version" ]; then
            echo "MARKETING_VERSION is $current; not moving it to $version"
            exit 0
          fi
          sed -i -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $version;/" "$pbx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $GITHUB_REF_NAME"
          # Pushed with GITHUB_TOKEN, so this commit doesn't start another workflow run.
          git push origin HEAD:main
