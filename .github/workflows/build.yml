name: Build

# Releasing: push a tag, e.g. `git tag v0.3.0 && git push origin v0.3.0`.
# The tag is the version: the apps are built with it, the release is published with them,
# and mygo.json on main is bumped to it afterwards.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the release on tags, and the mygo.json bump on main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: MyGo vet (stored build values, goroutine captures)
        run: for p in . ./internal/app ./internal/syncer ./internal/syncjob; do go tool mygo vet "$p"; done
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  build:
    needs: test
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Signing and disk images need macOS; MyGo needs no cgo, so Ubuntu builds Windows and Linux.
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME isn't vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # Only on this runner: the app and its file names carry the tag's version.
          jq --arg v "$version" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Collect the files to ship
        run: |
          mkdir -p dist
          version=$(jq -r .version mygo.json)
          case "${{ matrix.name }}" in
            macOS) cp build/darwin-*/*.dmg dist/ ;;
            Windows)
              for d in build/windows-*; do
                arch=${d##*-}
                cp "$d"/*Setup*.exe dist/ 2>/dev/null || true
                # The portable app: the exe needs the SQLite DLL and the icon next to it.
                (cd "$d" && zip -qr "../../dist/jira-ado-$version-windows-$arch-portable.zip" . -x '*Setup*')
              done ;;
            Linux) cp build/linux-*/*.deb build/linux-*/*.tar.gz dist/ && cp build/linux-amd64/install.sh dist/ ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: jira-ado-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release with the apps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A rerun: replace the files and make sure it's published.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi

  bump-version:
    # After the release: main's mygo.json says the newest released version, so local builds match.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Commit the version to main
        run: |
          version="${GITHUB_REF_NAME#v}"
          current=$(jq -r .version mygo.json)
          newest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)
          if [ "$current" = "$version" ] || [ "$newest" != "$version" ]; then
            echo "mygo.json is $current; not moving it to $version"
            exit 0
          fi
          jq --arg v "$version" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $GITHUB_REF_NAME"
          # Pushed with GITHUB_TOKEN, so this commit doesn't start another workflow run.
          git push origin HEAD:main
